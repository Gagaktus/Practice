<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Вход - Пассажирам.РФ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .wide-card {
            max-width: 550px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        @media (min-width: 576px) {
            .wide-card { max-width: 500px; }
        }
        @media (min-width: 768px) {
            .wide-card { max-width: 600px; }
        }
        @media (min-width: 992px) {
            .wide-card { max-width: 700px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 wide-card">
                <div class="card p-4">
                    <div class="text-center mb-3">
                        <i class="fas fa-bus fa-3x text-primary"></i>
                        <h2 class="mt-2">Вход</h2>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-user me-2"></i>Логин</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" name="login" class="form-control" placeholder="ivanov_ia" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-lock me-2"></i>Пароль</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i>Войти</button>
                        <div class="text-center mt-3">
                            <a href="/register.html"><i class="fas fa-user-plus me-1"></i>Нет аккаунта? Регистрация</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                window.location.href = '/dashboard.html';
            } else {
                const err = await response.json();
                showToast(err.error || 'Неверный логин или пароль', 'error');
            }
        });
    </script>
</body>
</html>
