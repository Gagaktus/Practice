<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Администратор - вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width:400px; margin-top:100px">
        <div class="card p-4">
            <div class="text-center mb-3">
                <i class="fas fa-shield-alt fa-3x text-dark"></i>
                <h3>Панель администратора</h3>
            </div>
            <form id="adminLoginForm">
                <div class="input-group mb-2">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="adminLogin" class="form-control" placeholder="Логин" required>
                </div>
                <div class="input-group mb-2">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="adminPassword" class="form-control" placeholder="Пароль" required>
                </div>
                <button class="btn btn-dark w-100"><i class="fas fa-sign-in-alt"></i> Войти</button>
            </form>
        </div>
    </div>
    <script src="/js/main.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('adminLogin').value;
            const password = document.getElementById('adminPassword').value;
            const res = await fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password })
            });
            if (res.ok) {
                window.location.href = '/admin-dashboard.html';
            } else {
                showToast('Неверные учётные данные', 'error');
            }
        });
    </script>
</body>
</html>
