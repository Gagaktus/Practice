<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Личный кабинет - Пассажирам.РФ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .container-custom {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            width: 100%;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-custom">
            <a class="navbar-brand" href="/dashboard.html"><i class="fas fa-bus me-2"></i>Пассажирам.РФ</a>
            <div class="ms-auto">
                <span class="text-white me-3" id="userName"><i class="fas fa-user-circle"></i> </span>
                <button onclick="logout()" class="btn btn-outline-light"><i class="fas fa-sign-out-alt"></i> Выйти</button>
            </div>
        </div>
    </nav>
    <div class="container-custom mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card p-3 mb-4">
                    <h4 class="text-center mb-3"><i class="fas fa-images me-2"></i>Наши преимущества</h4>
                    <div class="slider-container">
                        <div class="slides">
                            <div class="slide"><img src="/images/image01.webp" alt="Слайд 1"></div>
                            <div class="slide"><img src="/images/image02.jpg" alt="Слайд 2"></div>
                            <div class="slide"><img src="/images/image03.png" alt="Слайд 3"></div>
                            <div class="slide"><img src="/images/image04.jpg" alt="Слайд 4"></div>
                            <div class="slide"><img src="/images/image06.jpg" alt="Слайд 5"></div>
                            <div class="slide"><img src="/images/image07.jpg" alt="Слайд 6"></div>
                            <div class="slide"><img src="/images/image08.webp" alt="Слайд 7"></div>
                            <div class="slide"><img src="/images/image09.webp" alt="Слайд 8"></div>
                            <div class="slide"><img src="/images/image10.webp" alt="Слайд 9"></div>
                            <div class="slide"><img src="/images/image11.jpg" alt="Слайд 10"></div>
                            <div class="slide"><img src="/images/image12.webp" alt="Слайд 11"></div>
                            <div class="slide"><img src="/images/image13.webp" alt="Слайд 12"></div>
                            <div class="slide"><img src="/images/image14.png" alt="Слайд 13"></div>
                            <div class="slide"><img src="/images/image15.jpg" alt="Слайд 14"></div>
                            <div class="slide"><img src="/images/image16.jpg" alt="Слайд 15"></div>
                            <div class="slide"><img src="/images/image17.webp" alt="Слайд 16"></div>
                        </div>
                        <button class="prev"><i class="fas fa-chevron-left"></i></button>
                        <button class="next"><i class="fas fa-chevron-right"></i></button>
                        <div class="dots" id="dots"></div>
                    </div>
                </div>
                <div class="card p-4 mb-4">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h4><i class="fas fa-list-ul me-2"></i>Мои заявки</h4>
                        <a href="/new-application.html" class="btn btn-success"><i class="fas fa-plus-circle"></i> Новая заявка</a>
                    </div>
                    <div id="applicationsTable" class="table-responsive mt-3"></div>
                </div>
                <div class="card p-4" id="reviewSection" style="display:none;">
                    <h4><i class="fas fa-star me-2"></i>Оставить отзыв</h4>
                    <select id="reviewAppSelect" class="form-select mb-2"></select>
                    <textarea id="reviewText" class="form-control mb-2" rows="3" placeholder="Ваш отзыв..."></textarea>
                    <button id="submitReview" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Отправить</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/main.js"></script>
    <script>
        let currentUser = null;
        async function loadUser() {
            const res = await fetch('/api/user');
            if (!res.ok) window.location.href = '/login.html';
            currentUser = await res.json();
            document.getElementById('userName').innerHTML = `<i class="fas fa-user-circle"></i> ${currentUser.full_name}`;
        }
        async function loadApplications() {
            const res = await fetch('/api/user/applications');
            if (!res.ok) return;
            const apps = await res.json();
            const container = document.getElementById('applicationsTable');
            if (!apps.length) {
                container.innerHTML = '<p class="text-muted"><i class="fas fa-info-circle"></i> У вас пока нет заявок.</p>';
                return;
            }
            let html = '<div class="table-responsive"><table class="table table-striped"><thead><tr><th>Транспорт</th><th>Дата занятий</th><th>Оплата</th><th>Статус</th><th>Отзыв</th></tr></thead><tbody>';
            apps.forEach(app => {
                let badge = '';
                if (app.status === 'Новая') badge = '<span class="badge bg-warning">Новая</span>';
                else if (app.status === 'Идет обучение') badge = '<span class="badge bg-info">Идет обучение</span>';
                else badge = '<span class="badge bg-success">Обучение завершено</span>';
                html += `<tr>
                             <td><i class="fas fa-bus"></i> ${app.transport_name}</td>
                             <td>${new Date(app.time_of_lessons).toLocaleDateString()}</td>
                             <td>${app.payment_method}</td>
                             <td>${badge}</td>
                             <td>${app.review || '—'}</td>
                          </tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
            const completedNoReview = apps.filter(app => app.status === 'Обучение завершено' && !app.review);
            const reviewSection = document.getElementById('reviewSection');
            if (completedNoReview.length) {
                reviewSection.style.display = 'block';
                const select = document.getElementById('reviewAppSelect');
                select.innerHTML = completedNoReview.map(app => `<option value="${app.course_id}">${app.transport_name} (заявка №${app.course_id})</option>`).join('');
            } else {
                reviewSection.style.display = 'none';
            }
        }
        document.getElementById('submitReview')?.addEventListener('click', async () => {
            const appId = document.getElementById('reviewAppSelect').value;
            const text = document.getElementById('reviewText').value.trim();
            if (!text) return showToast('Введите отзыв', 'error');
            const res = await fetch('/api/reviews', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ application_id: appId, review_text: text })
            });
            if (res.ok) {
                showToast('Отзыв сохранён!', 'success');
                location.reload();
            } else {
                const err = await res.json();
                showToast(err.error, 'error');
            }
        });
        window.onload = async () => {
            await loadUser();
            await loadApplications();
            initSlider();
        };
    </script>
</body>
</html>
