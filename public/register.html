<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Регистрация - Пассажирам.РФ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .wide-card-reg {
            max-width: 800px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        body {
            background-image: url('/images/image07.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        @media (max-width: 767px) {
            .wide-card-reg {
                max-width: 100%;
                padding: 0 10px;
            }
        }
        .custom-row-reg {
            padding-top: 10vh;
        }
        @media (max-height: 700px) {
            .custom-row-reg {
                padding-top: 5vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center custom-row-reg min-vh-100">
            <div class="col-12 wide-card-reg">
                <div class="card p-4">
                    <div class="text-center">
                        <img src="/images/image02.jpg" alt="Эмблема" style="max-height: 70px; width: auto; margin-bottom: 10px;">
                    </div>
                    <div class="text-center mb-3">
                        <h2>Регистрация</h2>
                    </div>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label><i class="fas fa-user me-2"></i>Логин (латиница+цифры, ≥6)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" name="login" id="login" class="form-control" required>
                            </div>
                            <div class="invalid-feedback" id="loginError"></div>
                        </div>
                        <div class="mb-3">
                            <label><i class="fas fa-lock me-2"></i>Пароль (≥8 символов)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="password" name="password" id="password" class="form-control" required>
                            </div>
                            <div class="invalid-feedback" id="passError"></div>
                        </div>
                        <div class="mb-3">
                            <label><i class="fas fa-signature me-2"></i>Полное имя</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user-circle"></i></span>
                                <input type="text" name="full_name" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label><i class="fas fa-calendar-alt me-2"></i>Дата рождения</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-birthday-cake"></i></span>
                                <input type="date" name="birth_date" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label><i class="fas fa-envelope me-2"></i>Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-at"></i></span>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label><i class="fas fa-phone-alt me-2"></i>Телефон</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                <input type="tel" name="phone" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100"><i class="fas fa-check-circle me-2"></i>Зарегистрироваться</button>
                        <div class="text-center mt-3">
                            <a href="/login.html"><i class="fas fa-sign-in-alt me-1"></i>Уже есть аккаунт? Войти</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            let valid = true;
            if (!isValidLogin(login)) {
                document.getElementById('loginError').innerText = 'Логин должен содержать латиницу и цифры, минимум 6 символов';
                document.getElementById('login').classList.add('is-invalid');
                valid = false;
            } else {
                document.getElementById('login').classList.remove('is-invalid');
            }
            if (!isValidPassword(password)) {
                document.getElementById('passError').innerText = 'Пароль должен быть не менее 8 символов';
                document.getElementById('password').classList.add('is-invalid');
                valid = false;
            } else {
                document.getElementById('password').classList.remove('is-invalid');
            }
            if (!valid) return;
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (response.ok) {
                showToast('Регистрация успешна! Теперь войдите.', 'success');
                setTimeout(() => window.location.href = '/login.html', 1500);
            } else {
                showToast(result.error || 'Ошибка регистрации', 'error');
            }
        });
    </script>
</body>
</html>
