<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Управление заявками - Администратор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Расширяем контейнер */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            width: 100%;
        }
        .table-responsive {
            overflow-x: auto;
        }
        .status-select {
            width: auto;
            min-width: 140px;
            display: inline-block;
        }
        .save-status {
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand"><i class="fas fa-tachometer-alt me-2"></i>Панель администратора</span>
            <button onclick="adminLogout()" class="btn btn-outline-light"><i class="fas fa-sign-out-alt"></i> Выйти</button>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card p-4">
            <h4><i class="fas fa-clipboard-list me-2"></i>Все заявки</h4>
            <div id="applicationsList" class="mt-3"></div>
        </div>
    </div>
    <script src="/js/main.js"></script>
    <script>
        async function loadApplications() {
            const res = await fetch('/api/admin/applications?limit=1000');
            if (!res.ok) {
                showToast('Сессия истекла, войдите снова', 'error');
                window.location.href = '/admin-login.html';
                return;
            }
            const data = await res.json();
            renderApplications(data.applications);
        }
        function renderApplications(apps) {
            const container = document.getElementById('applicationsList');
            if (!apps.length) {
                container.innerHTML = '<p class="text-muted"><i class="fas fa-info-circle"></i> Заявок не найдено</p>';
                return;
            }
            let html = '<div class="table-responsive"><table class="table table-bordered"><thead><tr><th>№</th><th>Пользователь</th><th>Транспорт</th><th>Дата занятий</th><th>Оплата</th><th>Статус</th></tr></thead><tbody>';
            apps.forEach(app => {
                html += `<tr>
                             <td>${app.course_id}</td>
                             <td>${app.user_name}</td>
                             <td>${app.transport_name}</td>
                             <td>${new Date(app.time_of_lessons).toLocaleDateString()}</td>
                             <td>${app.payment_method}</td>
                             <td>
                                <select class="status-select form-select form-select-sm" data-id="${app.course_id}">
                                    <option value="Новая" ${app.status === 'Новая' ? 'selected' : ''}>Новая</option>
                                    <option value="Идет обучение" ${app.status === 'Идет обучение' ? 'selected' : ''}>Идет обучение</option>
                                    <option value="Обучение завершено" ${app.status === 'Обучение завершено' ? 'selected' : ''}>Обучение завершено</option>
                                </select>
                                <button class="btn btn-sm btn-primary save-status mt-1" data-id="${app.course_id}"><i class="fas fa-save"></i> Сохранить</button>
                             </td>
                          </tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
            document.querySelectorAll('.save-status').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.getAttribute('data-id');
                    const newStatus = document.querySelector(`.status-select[data-id="${id}"]`).value;
                    const res = await fetch(`/api/admin/applications/${id}/status`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: newStatus })
                    });
                    if (res.ok) {
                        showToast('Статус обновлён', 'success');
                        loadApplications();
                    } else {
                        showToast('Ошибка при обновлении статуса', 'error');
                    }
                });
            });
        }
        window.onload = loadApplications;
    </script>
</body>
</html>
